<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لا يوجد اتصال | أكاديمية عرب فريلانسر</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <!-- صفحة مستقلة بذاتها لضمان عملها دون أي موارد خارجية -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: #0a101f; color: #eef2f9;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem; gap: 1.1rem;
    }
    .icon-wrap {
      width: 90px; height: 90px; border-radius: 24px;
      background: rgba(254,138,2,.14);
      display: flex; align-items: center; justify-content: center;
      color: #fe8a02; margin-bottom: .5rem;
    }
    .icon-wrap svg { width: 46px; height: 46px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.5rem; font-weight: 800; }
    p { color: #a7b4cc; max-width: 420px; line-height: 1.8; }
    button {
      margin-top: .5rem; font-family: inherit; font-weight: 700; font-size: .95rem;
      background: #fe8a02; color: #fff; border: none;
      padding: .75rem 2rem; border-radius: 10px; cursor: pointer;
    }
    button:hover { background: #d97400; }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
  </div>
  <h1>انقطع الاتصال بالإنترنت</h1>
  <p>لا تقلق، تقدر تعاود المحاولة أول ما يرجع الاتصال — وسننقلك تلقائياً للصفحة الرئيسية.</p>
  <button onclick="location.replace('/')">إعادة المحاولة</button>
  <script>
    window.addEventListener('online', () => location.replace('/'));
  </script>
</body>
</html>
