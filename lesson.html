<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">جاري تحميل الدرس... | أكاديمية عرب فريلانسر</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lesson-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 1rem;
        }
        .main-content {
            flex: 3;
            min-width: 300px;
        }
        .sidebar {
            flex: 1;
            min-width: 250px;
            background-color: var(--surface-color);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            align-self: start;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* نسبة 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 1rem;
            background-color: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .lesson-list {
            list-style: none;
            padding: 0;
        }
        .lesson-item {
            padding: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lesson-item:hover {
            background-color: var(--bg-color);
        }
        .lesson-item.active {
            border-right: 4px solid var(--primary-color);
            background-color: var(--bg-color);
            font-weight: bold;
        }
        .notes-section {
            margin-top: 2rem;
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .note-item {
            background-color: var(--bg-color);
            padding: 0.8rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
        }
        .timestamp-btn {
            color: var(--primary-color);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="/" class="logo">أكاديمية عرب فريلانسر</a>
            <nav>
                <a href="courses.html" class="btn" style="color: var(--text-color);">الكورسات</a>
                <button id="theme-toggle" class="btn" style="background:none; border:1px solid var(--border-color); color:var(--text-color);">🌙</button>
            </nav>
        </div>
    </header>

    <div class="container lesson-layout">
        <!-- القسم الرئيسي: الفيديو والملاحظات -->
        <div class="main-content">
            <h1 id="course-title" style="margin-bottom: 1rem;">...</h1>
            <h3 id="lesson-title" style="color: var(--secondary-color); margin-bottom: 1rem;">...</h3>
            
            <div class="video-wrapper">
                <div id="player"></div> <!-- هذا العنصر سيتم استبداله بمشغل يوتيوب عبر الـ API -->
            </div>
            
            <p id="lesson-desc" style="margin-bottom: 1rem;"></p>
            
            <button id="mark-complete-btn" class="btn btn-secondary" style="width: 100%; margin-bottom: 2rem;">✅ وضع علامة "مكتمل"</button>

            <!-- قسم الملاحظات الزمنية -->
            <div class="notes-section">
                <h3>ملاحظاتي على هذا الدرس</h3>
                <textarea id="note-text" placeholder="اكتب ملاحظتك هنا..." rows="3" style="width: 100%; margin-top: 1rem;"></textarea>
                <button id="save-note-btn" class="btn btn-primary" style="margin-top: 0.5rem;">حفظ الملاحظة (عند الوقت الحالي)</button>
                
                <div id="notes-list" style="margin-top: 1.5rem;">
                    <!-- الملاحظات المحفوظة ستظهر هنا -->
                </div>
            </div>
        </div>

        <!-- الشريط الجانبي: قائمة الدروس -->
        <div class="sidebar">
            <h3 style="margin-bottom: 1rem; border-bottom: 2px solid var(--primary-color); padding-bottom: 0.5rem;">محتوى الكورس</h3>
            <ul id="lesson-list" class="lesson-list">
                <!-- سيتم تعبئة الدروس هنا -->
                <li>جاري التحميل...</li>
            </ul>
        </div>
    </div>

    <!-- استدعاء YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="lesson.js"></script>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        let currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
        });
    </script>
</body>
</html>
