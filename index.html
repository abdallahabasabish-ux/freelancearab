<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | أكاديمية عرب فريلانسر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="/" class="logo">أكاديمية عرب فريلانسر</a>
            <nav>
                <button id="theme-toggle" class="btn" style="background:none; border:1px solid var(--border-color); color:var(--text-color);">🌙</button>
            </nav>
        </div>
    </header>

    <div class="container" style="max-width: 800px; margin-top: 2rem;">
        
        <!-- قسم المصادقة -->
        <div id="auth-section" class="card" style="max-width: 500px; margin: 0 auto;">
            <h2 style="color: var(--primary-color); margin-bottom: 1rem; text-align: center;">إنشاء حساب / تسجيل دخول</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">انضم إلينا لتبدأ مسيرتك في العمل الحر.</p>

            <button id="google-login-btn" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">تسجيل الدخول باستخدام Google</button>
            <div id="auth-alert" class="alert"></div>

            <form id="profile-form" style="display: none; margin-top: 1.5rem;">
                <h3 style="margin-bottom: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">استكمال بياناتك (لمرة واحدة)</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="f-name" placeholder="الاسم الأول" required>
                    <input type="text" id="l-name" placeholder="اسم العائلة" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="c-code" placeholder="كود الدولة (+20)" style="width: 30%;" required>
                    <input type="tel" id="phone" placeholder="رقم الهاتف" style="width: 70%;" required>
                </div>
                <input type="number" id="age" placeholder="العمر" min="12" max="99" required>
                <p style="font-size: 0.85rem; color: var(--secondary-color); margin-bottom: 1rem;">ملاحظة: سيتم طلب إذن تحديد الموقع الجغرافي لتوثيق الحساب.</p>
                <button type="submit" id="save-profile-btn" class="btn btn-secondary" style="width: 100%;">حفظ ودخول الأكاديمية</button>
            </form>
        </div>

        <!-- قسم لوحة الطالب (يظهر بعد الدخول) -->
        <div id="user-dashboard" style="display: none;">
            <div class="card" style="text-align: center; margin-bottom: 2rem;">
                <img id="user-photo" src="" alt="الصورة الشخصية" style="width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary-color); margin-bottom: 1rem;">
                <h2 id="welcome-message" style="color: var(--primary-color); margin-bottom: 0.5rem;"></h2>
                <p id="user-info" style="color: var(--text-muted); margin-bottom: 1rem;"></p>
                <p style="font-size: 1.2rem; font-weight: bold; margin-bottom: 1.5rem;">النقاط المكتسبة: <span id="user-points" style="color: var(--secondary-color);">0</span> 🏆</p>
                
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <a href="courses.html" class="btn btn-primary">تصفح الكورسات</a>
                    <button id="logout-btn" class="btn btn-danger">تسجيل خروج</button>
                </div>
            </div>

            <div class="card">
                <h3 style="border-bottom: 2px solid var(--primary-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem; display: inline-block;">شهاداتي المعتمدة</h3>
                <div id="certificates-list">
                    <p style="color: var(--text-muted);">جاري تحميل الشهادات...</p>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="auth.js"></script>
    <script>
        const tt = document.getElementById('theme-toggle');
        let th = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', th);
        tt.onclick = () => { th = th === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', th); localStorage.setItem('theme', th); };
    </script>
</body>
</html>
