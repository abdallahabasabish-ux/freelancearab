<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | أكاديمية عرب فريلانسر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="/" class="logo">أكاديمية عرب فريلانسر</a>
            <button id="theme-toggle" class="btn" style="background:none; border:1px solid var(--border-color); color:var(--text-color);">تبديل الوضع 🌙</button>
        </div>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 2rem;">
        
        <!-- قسم تسجيل الدخول / التسجيل -->
        <div id="auth-section" style="background-color: var(--surface-color); padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color);">
            <h2 style="margin-bottom: 1rem; color: var(--primary-color);">إنشاء حساب جديد</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-muted);">للوصول إلى الكورسات وتتبع تقدمك.</p>

            <button id="google-login-btn" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem; background-color: #4285F4;">
                التسجيل بواسطة Google (مُستحسن)
            </button>
            
            <div style="text-align: center; margin-bottom: 1rem; color: var(--text-muted);">أو</div>

            <!-- نموذج استكمال البيانات الإلزامية -->
            <form id="profile-form" style="display: none;">
                <h3 style="margin-bottom: 1rem;">استكمال بيانات الملف الشخصي</h3>
                
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="first-name" placeholder="الاسم الأول" required>
                    <input type="text" id="middle-name" placeholder="الاسم الأوسط" required>
                    <input type="text" id="last-name" placeholder="اسم العائلة" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <input type="text" id="country-code" placeholder="كود الدولة (+20)" style="width: 30%;" required>
                    <input type="tel" id="phone" placeholder="رقم الهاتف" style="width: 70%;" required>
                </div>

                <input type="number" id="age" placeholder="السن" min="10" max="100" required>
                
                <p style="font-size: 0.9rem; color: var(--secondary-color); margin-bottom: 0.5rem;">سيتم تحديد الدولة والمدينة جغرافياً بشكل تلقائي لحفظها في ملفك.</p>
                
                <button type="submit" id="save-profile-btn" class="btn btn-secondary" style="width: 100%;">حفظ البيانات والدخول للأكاديمية</button>
            </form>
            
            <p id="auth-message" style="margin-top: 1rem; font-weight: bold; text-align: center;"></p>
        </div>

        <!-- قسم عرض حالة تسجيل الدخول (يظهر بعد الدخول بنجاح) -->
        <div id="user-dashboard" style="display: none; text-align: center; margin-top: 2rem;">
            <img id="user-photo" src="" alt="صورة المستخدم" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary-color);">
            <h2 id="welcome-message" style="margin-top: 1rem;"></h2>
            <p id="user-location" style="color: var(--text-muted); margin-bottom: 1rem;"></p>
            <a href="courses.html" class="btn btn-primary">تصفح الكورسات</a>
            <button id="logout-btn" class="btn" style="background-color: #ef4444; color: white;">تسجيل خروج</button>
        </div>

    </div>

    <script type="module" src="auth.js"></script>
    <script>
        // تسجيل PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
        
        // كود بسيط لتبديل الوضع الليلي
        const themeToggle = document.getElementById('theme-toggle');
        let currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
        });
    </script>
</body>
</html>
