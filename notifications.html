<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإشعارات | أكاديمية عرب فريلانسر</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('afa-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0a101f' : '#ffffff');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/cert-notif.css">
</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/icons/icon.svg" alt="" class="brand-logo" width="42" height="42">
        <span class="brand-name">أكاديمية <b>عرب فريلانسر</b></span>
      </a>
      <nav class="main-nav" id="mainNav" aria-label="التنقل الرئيسي">
        <a href="/" class="nav-link">الرئيسية</a>
        <a href="/courses.html" class="nav-link">الكورسات</a>
        <a href="/dashboard.html" class="nav-link active">لوحتي</a>
        <a href="/verify.html" class="nav-link">التحقق من شهادة</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" data-theme-toggle aria-label="تبديل الوضع الليلي">
          <svg class="icon i-sun" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sun"></use></svg>
          <svg class="icon i-moon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-moon"></use></svg>
        </button>
        <div class="user-chip" data-auth-user hidden>
          <a href="/profile.html" class="user-chip-link" title="ملفي الشخصي">
            <img class="user-avatar" data-user-avatar alt="" src="/assets/icons/icon.svg">
            <span class="user-name" data-user-name>حسابي</span>
          </a>
          <button class="icon-btn" data-logout aria-label="تسجيل الخروج" title="تسجيل الخروج">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-log-out"></use></svg>
          </button>
        </div>
        <a href="/login.html" class="btn btn-outline btn-sm" data-auth-guest hidden>دخول</a>
        <a href="/register.html" class="btn btn-accent btn-sm" data-auth-guest hidden>ابدأ مجاناً</a>
        <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mainNav" aria-label="فتح القائمة">
          <svg class="icon i-menu" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-menu"></use></svg>
          <svg class="icon i-x" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-x"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="notif-page">
    <div class="container">

      <div class="notif-toolbar">
        <div>
          <h1>الإشعارات</h1>
          <p class="notif-count" id="notifCount"></p>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="markAllBtn" hidden>
          <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-check"></use></svg>
          تعليم الكل كمقروء
        </button>
      </div>

      <div class="card" style="padding: .5rem 1rem;">
        <div class="notif-list" id="notifList"></div>
        <div class="empty-state" id="notifEmpty" hidden style="padding: 3rem 1rem;">
          <svg class="icon icon-xl" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-bell"></use></svg>
          <h3>لا توجد إشعارات بعد</h3>
          <p>سننبهك هنا عند إصدار شهادتك أو إضافة كورسات جديدة.</p>
        </div>
      </div>

    </div>
  </main>

  <script src="/assets/js/theme.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
  <script type="module" src="/assets/js/notifications.js"></script>
</body>
</html>
