<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | أكاديمية عرب فريلانسر</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: #f5f7fb; color: #101828;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem; gap: 1rem;
    }
    .num {
      font-size: clamp(5rem, 18vw, 9rem); font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, #1e3a8a, #fe8a02);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    h1 { font-size: 1.4rem; font-weight: 800; }
    p { color: #475467; max-width: 420px; line-height: 1.8; }
    a {
      margin-top: .75rem; font-weight: 700; text-decoration: none;
      background: #1e3a8a; color: #fff;
      padding: .75rem 2rem; border-radius: 10px;
    }
    a:hover { background: #16296b; }
  </style>
</head>
<body>
  <div class="num">404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>يبدو أن الرابط الذي تبحث عنه غير صحيح أو تم نقله. ما رأيك أن نرجعك للطريق الصحيح؟</p>
  <a href="/">العودة للرئيسية</a>
</body>
</html>
